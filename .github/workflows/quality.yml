name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: [self-hosted, 1msg-ci-heavy]
    container:
      image: node:26.13.1-bookworm@sha256:b7087bc4d973034b30854b378ba107f9fab622b47514cb7e2592e41b8bab8d49
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tools/quality --ignore-workspace install --lockfile-dir "$PWD/quality/tooling" --frozen-lockfile --ignore-scripts
      - run: pnpm run test:preset
      - run: pnpm run quality:guards
      - run: pnpm run format:check
      - run: pnpm run lint:static
      - run: pnpm run lint:typed
      - run: pnpm run typecheck
      - run: pnpm run lint:arch
      - run: pnpm run lint:unused:production
      - run: pnpm run lint:unused:full
      - run: pnpm run lint:duplicates
      - run: pnpm run lint:duplicates:full
      - run: pnpm run lint:complexity
      - run: pnpm run test:generated
      - run: pnpm run test:quality
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: quality/reports/
          if-no-files-found: error
      - name: Return the workspace to the runner user
        if: always()
        run: |
          set -euo pipefail
          runner_root="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          owner="$(stat -c '%u:%g' "$runner_root")"
          chown -R "$owner" "$GITHUB_WORKSPACE" || true
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP" ]; then chown -R "$owner" "$RUNNER_TEMP" || true; fi
  package-consumer:
    runs-on: [self-hosted, 1msg-ci-heavy]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Pack the actual distributable
        run: mkdir -p "$RUNNER_TEMP/packed" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packed"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bash scripts/consumer-smoke.sh "$RUNNER_TEMP"/packed/*.tgz '@1msg/mcp'
  release-artifact:
    runs-on: [self-hosted, 1msg-ci-heavy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/container-smoke.sh
  quality-required:
    if: always()
    needs: [checks, package-consumer, release-artifact]
    runs-on: [self-hosted, 1msg-ci-heavy]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(!Object.values(jobs).every(job=>job.result==="success")) process.exit(1)'
