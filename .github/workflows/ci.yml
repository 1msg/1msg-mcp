name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Smoke tools/list
        run: pnpm run smoke:tools-list
        env:
          ONE_MSG_BASE_URL: https://api.1msg.io
          ONE_MSG_INSTANCE_ID: TEST_INSTANCE
          ONE_MSG_TOKEN: test-token

      - name: npm pack (dry readiness)
        run: npm pack --dry-run
